name: Build and release

# Push to main with a new "version" in package.json and a release for that version is
# created automatically. Pushing a v* tag (re)publishes that tag's release.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['README.md', '.github/release-notes.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer and portable exe
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              gh release upload "$TAG" dist/*.exe --clobber
            else
              echo "Release $TAG already exists. Bump the version in package.json to publish a new one."
            fi
          else
            gh release create "$TAG" dist/*.exe --target "$GITHUB_SHA" --title "Kami-oke ${TAG#v}" --notes-file .github/release-notes.md
          fi
